# Phase 1 rain / wetness ingest configuration (see docs/phase1-design.md D5, D6).
# One bounding box covers both region boxes (himalaya lat 22-36 / lon 72-98 and western_ghats lat 8-21.5 / lon 72.5-78.5).
domain_bbox:
  lat_min: 8.0
  lat_max: 36.0
  lon_min: 72.0
  lon_max: 98.0

# Days that need rain data: every day of the labelled years (training, validation, 2018 test, sparse)...
full_years:
  start: 2007
  end: 2018
# ...plus the windows around the 2023 India inventory (window 2023-06-16..2023-07-31 plus a 30-day look-back)
# and the Wayanad 2024 case study (event 2024-07-30 plus a 30-day look-back).
extra_ranges:
  - {start: "2023-05-01", end: "2023-08-15"}
  - {start: "2024-06-01", end: "2024-08-15"}

# IMD gauge-based 0.25 deg grid (India only): whole years, because files are yearly.
imd:
  start_year: 2007
  end_year: 2024
  grid: {lat_min: 6.5, lat_max: 38.5, lon_min: 66.5, lon_max: 100.0, step: 0.25}   # 129 x 135, verified in the Phase 0 audit
  missing_value: -999.0

# NASA POWER MERRA-2 daily (UTC store), antecedent soil wetness only.
power:
  zarr: "s3://nasa-power/merra2/temporal/power_merra2_daily_temporal_utc.zarr"
  variables: ["GWETTOP", "GWETROOT"]

chirps:
  url: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/global_daily/tifs/p05/{y}/chirps-v2.0.{y}.{m}.{d}.tif.gz"
  workers: 6
